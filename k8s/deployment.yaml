apiVersion: apps/v1
kind: Deployment
metadata:
  name: movie-catalog-app
  labels:
    app: movie-catalog
spec:
  replicas: 2  # Увеличено до 2 для отказоустойчивости
  selector:
    matchLabels:
      app: movie-catalog
  template:
    metadata:
      labels:
        app: movie-catalog
    spec:
      containers:
      - name: movie-catalog
        image: irinan0/movie-catalog:latest  
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: movie-catalog-service
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "external"
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: "instance"
    service.beta.kubernetes.io/aws-load-balancer-eip-allocations: "eipalloc-0e75e140c404e5762,eipalloc-0fb33148e19ddf905"
spec:
  type: LoadBalancer
  selector:
    app: movie-catalog
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80