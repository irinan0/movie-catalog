apiVersion: v1
kind: Service
metadata:
  name: {{ include "movie-catalog.fullname" . }}-frontend
spec:
  type: NodePort
  ports:
    - port: {{ .Values.frontend.service.port }}
      targetPort: {{ .Values.frontend.service.targetPort }}
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: frontend
