apiVersion: v1
kind: Service
metadata:
  name: {{ include "movie-catalog.fullname" . }}-backend
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.backend.service.port }}
      targetPort: {{ .Values.backend.service.targetPort }}
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: backend
