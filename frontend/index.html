<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Catalog</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <!-- Header -->
        <header class="mb-8 text-center">
            <h1 class="text-4xl font-extrabold tracking-tight mb-2">Movie Catalog</h1>
            <p class="text-slate-400">Discover your favorite movies and streaming options</p>
        </header>

        <!-- Controls: Filters & Sorting -->
        <div class="flex flex-col md:flex-row justify-between items-center bg-slate-800 p-4 rounded-xl shadow-md gap-4 mb-8">
            <!-- Genre Filter -->
            <div class="flex items-center gap-2 w-full md:w-auto">
                <label for="genreFilter" class="font-medium text-slate-300">Genre:</label>
                <select id="genreFilter" class="bg-slate-700 border border-slate-600 rounded-lg px-3 py-2 text-slate-100 focus:outline-none focus:ring-2 focus:ring-indigo-500 w-full md:w-48">
                    <option value="All">All Genres</option>
                </select>
            </div>

            <!-- Sorting -->
            <div class="flex items-center gap-4 w-full md:w-auto justify-end">
                <div class="flex items-center gap-2">
                    <label for="sortBy" class="font-medium text-slate-300">Sort by:</label>
                    <select id="sortBy" class="bg-slate-700 border border-slate-600 rounded-lg px-3 py-2 text-slate-100 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        <option value="title">Title</option>
                        <option value="year">Year</option>
                    </select>
                </div>
                <div class="flex items-center gap-2">
                    <label for="sortOrder" class="font-medium text-slate-300">Order:</label>
                    <select id="sortOrder" class="bg-slate-700 border border-slate-600 rounded-lg px-3 py-2 text-slate-100 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        <option value="asc">Asc</option>
                        <option value="desc">Desc</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Movie Grid -->
        <div id="movieGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <!-- Dynamic cards will be inserted here -->
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
