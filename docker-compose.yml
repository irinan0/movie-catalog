version: '3.8'

services:
  backend:
    build: ./backend
    container_name: movie-catalog-backend
    ports:
      - "8000:8000"
    restart: always

  frontend:
    build: ./frontend
    container_name: movie-catalog-frontend
    ports:
      - "8080:80"
    restart: always

  jenkins:
    image: jenkins/jenkins:lts
    container_name: jenkins-server
    restart: always
    user: root
    dns:
      - 8.8.8.8
      - 1.1.1.1
    ports:
      - "9090:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9091:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    restart: unless-stopped
  
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  jenkins_home: